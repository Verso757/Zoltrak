name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Codigo Fuente
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generar Keystore Corporativo y Compilar APKs
        working-directory: ./android_app
        run: |
          mkdir -p app
          # Generar Keystore Empresarial para evitar bloqueos de Google Play Protect
          if [ ! -f app/rutacontrol_release.keystore ]; then
            keytool -genkeypair -v \
              -keystore app/rutacontrol_release.keystore \
              -alias rutacontrol \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass rutacontrol2026 \
              -keypass rutacontrol2026 \
              -dname "CN=RutaControl Enterprise, OU=Fleet MDM, O=Garcia Solutions, L=Monterrey, ST=Nuevo Leon, C=MX"
          fi
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew || true
          ./gradlew assembleDebug --stacktrace
          ./gradlew assembleRelease --stacktrace

      - name: Extraer y Mostrar Hashes de Firma (Signature Checksums)
        run: |
          APK_DEBUG=$(find android_app/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          APK_RELEASE=$(find android_app/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "APK Debug: $APK_DEBUG"
          echo "APK Release: $APK_RELEASE"
          echo "================ HASHES PARA ANDROID ENTERPRISE QR ================"
          
          HEX_CERT_SHA256=$(keytool -list -v -keystore android_app/app/rutacontrol_release.keystore -alias rutacontrol -storepass rutacontrol2026 | grep -i "SHA256:" | head -n 1 | awk '{print $2}' | tr -d ':')
          echo "Signature SHA-256 (Hex): $HEX_CERT_SHA256"
          
          BASE64_SIG=$(echo "$HEX_CERT_SHA256" | xxd -r -p | base64 | tr '+/' '-_' | tr -d '=')
          echo "Signature Checksum (Base64 URL-Safe para QR): $BASE64_SIG"
          echo "===================================================================="

      - name: Guardar APKs como Artefactos Descargables
        uses: actions/upload-artifact@v4
        with:
          name: RutaControl-Telematics-APKs
          path: |
            android_app/app/build/outputs/apk/debug/*.apk
            android_app/app/build/outputs/apk/release/*.apk
          retention-days: 14

