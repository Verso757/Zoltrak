name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Codigo Fuente
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Aceptar Licencias y Preparar Entorno Android
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          mkdir -p android_app
          echo "sdk.dir=$ANDROID_HOME" > android_app/local.properties

      - name: Compilar APK Debug
        working-directory: ./android_app
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Guardar APK como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: RutaControl-Telematics-APK
          path: android_app/app/build/outputs/apk/debug/*.apk
          retention-days: 14


