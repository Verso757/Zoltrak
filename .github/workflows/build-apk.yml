name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Codigo Fuente
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Aceptar Licencias de Android SDK
        run: |
          yes | sdkmanager --licenses || true

      - name: Configurar Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Generar Wrapper y Compilar APK Debug
        working-directory: ./android_app
        run: |
          gradle wrapper --gradle-version 8.4 --distribution-type bin
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace --no-build-cache

      - name: Guardar APK como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: RutaControl-Telematics-APK
          path: android_app/app/build/outputs/apk/debug/*.apk
          retention-days: 14

